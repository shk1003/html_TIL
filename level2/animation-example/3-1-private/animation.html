<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션 CSS</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <style>
        /* 애니메이션 제작 순서
        1. 목표 정하기
        2. @keyframes 장면생성
        3. 특정요소 animation 불러오기 */
        .bg {
            height: 100vh; background: aqua;
            background-image: url(https://images.freeimages.com/images/large-previews/0b3/bright-sky-1393226.jpg);
            background-size: 300%;
            background-position: 0 0;/* 초기위치 */
            animation: bg 50s linear both;
            overflow: hidden;
        }
        .bg p {animation: ball_move1 3s ease infinite reverse;}
        .bg p img {animation: rotate 2s linear infinite}
        .bg h1 {animation: ball_move2 5s infinite;}
        .bg h1 img {animation: rotate 2s linear infinite;}
        @keyframes bg {
            0% {background-position-x: 0 ;}
            100% {background-position-x: 200%;}
        }
        @keyframes ball_move1 {
            0% {transform: translate(0,0);}
            30% {transform: translate(500px,0);}
            60% {transform: translate(250px,500px);}
            100% {transform: translate(0,0);}
        }
        @keyframes rotate {
            0% {rotate: 0;}
            100% {rotate: 360deg;}
        }
        @keyframes ball_move2 {
            0% {transform: translate(0,0);}
            20% {transform: translate(600px,0);}
            50% {transform: translate(0,600px);}
            70% {transform: translate(600px,600px);}
            100% {transform: translate(0,0);}
        }
    </style>
</head>
<body>
    <div class="bg">
        <p><img src="https://cdn-icons-png.flaticon.com/128/17278/17278677.png" alt=""></p>
        <h1><img src="https://cdn-icons-png.flaticon.com/128/17272/17272387.png" alt=""></h1>
    </div>
</body>
</html>
