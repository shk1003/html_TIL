<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션 연습</title>
    <style>
        body {background: #000;}
        main {width: 100%; height: 100vh; display:flex; flex-flow:column nowrap; justify-content: center; align-items: center;}
        main p img {}
        main h1 {
            font-size: 4rem; font-weight: 700;
            margin: 0 auto; text-align: center; 
            background: linear-gradient(to right, #2d84a7, #ff8b8b, #5b8ea1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: move 3s linear alternate infinite;
        }
        main h2 {
            font-weight: 900; font-size: 7rem;
            font-family: 'Black Ops One';
            text-shadow:0 0 30px rgba(255,255,255,0.2);
            text-align: center;
            background: url(./wave.jpg) center / cover;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: scale 3s linear alternate infinite;
        }
        main p {color: #ff8b8b;}
        @keyframes move {
            0% {transform: translateY(0);}
            100% {transform: translateY(10px);}
        }
        @keyframes scale {
            0% {transform: scale(1);}
            100% {transform: scale(1.1);}
        }

    </style>
</head>
<body>
    <main>
        <span class=""></span>
        <h1>CREATIVE</h1>
        <h2>WORKS</h2>
    </main>
</body>
</html>
